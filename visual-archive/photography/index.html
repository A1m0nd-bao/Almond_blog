<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>摄影作品集 · Almond</title>
  <link rel="icon" type="image/svg+xml" href="/Almond_blog/images/almond-mark.svg?v=2">
  <link rel="stylesheet" href="/Almond_blog/dist/main.css">
  <link rel="stylesheet" href="/Almond_blog/css/fonts/remixicon.css">
  <link rel="stylesheet" href="/Almond_blog/css/custom.css?v=archive-single-page-1">
</head>
<body>
  <div id="app">
    <main class="content on">
      <section class="photo-reader">
        <header class="photo-reader-bar">
          <a href="/Almond_blog/visual-archive/" class="reader-back">← 视觉档案</a>
          <div><span>PHOTOGRAPHY</span><b>记着光，也记着走过的地方。</b></div>
          <span class="reader-hint">← → / SWIPE</span>
        </header>
        <div class="photo-reader-stage" id="photo-reader-stage">
          <div class="reader-book" id="reader-book" aria-live="polite">
            <canvas id="reader-canvas" role="img" aria-label="摄影作品第 1 页"></canvas>
          </div>
        </div>
        <footer class="photo-reader-controls">
          <button type="button" id="reader-prev" aria-label="上一页">←</button>
          <span><b id="reader-range">01</b><i>/</i><em>78</em></span>
          <button type="button" id="reader-next" aria-label="下一页">→</button>
        </footer>
      </section>
    </main>
    <aside class="sidebar on"><button class="navbar-toggle"></button><nav class="navbar"><div class="logo"><a href="/Almond_blog/" aria-label="Almond 首页"><span class="almond-logo-mark" aria-hidden="true">A1M0ND</span></a></div><ul class="nav nav-main"><li class="nav-item"><a class="nav-item-link" href="/Almond_blog/">主页</a></li><li class="nav-item"><a class="nav-item-link" href="/Almond_blog/#projects">作品集</a></li><li class="nav-item"><a class="nav-item-link" href="/Almond_blog/visual-archive/">视觉档案</a></li><li class="nav-item"><a class="nav-item-link" href="/Almond_blog/visual-archive/photography/">摄影作品集</a></li><li class="nav-item"><a class="nav-item-link" href="/Almond_blog/visual-archive/tech-art/">技术美术案例</a></li><li class="nav-item"><a class="nav-item-link" href="/Almond_blog/archives">文章归档</a></li><li class="nav-item"><a class="nav-item-link" target="_blank" rel="noopener" href="https://github.com/A1m0nd-bao">GitHub</a></li></ul></nav></aside>
  </div>
  <script src="/Almond_blog/js/jquery-3.6.0.min.js"></script><script src="/Almond_blog/dist/main.js"></script>
  <script>
    (function () {
      var total = 78, start = 0, busy = false;
      var book = document.getElementById('reader-book');
      var canvas = document.getElementById('reader-canvas');
      var context = canvas.getContext('2d');
      var range = document.getElementById('reader-range');
      var prev = document.getElementById('reader-prev');
      var next = document.getElementById('reader-next');
      prev.disabled = true;
      next.disabled = true;
      function path(index) { return '/Almond_blog/visual-archive/photos/IMG_' + (9518 + index) + '.JPG'; }
      function load(index) {
        return new Promise(function (resolve, reject) {
          var image = new Image();
          image.onload = function () { resolve(image); };
          image.onerror = reject;
          image.src = path(index);
        });
      }
      function updateControls() {
        range.textContent = String(start + 1).padStart(2, '0');
        canvas.setAttribute('aria-label', '摄影作品第 ' + (start + 1) + ' 页');
        prev.disabled = start === 0;
        next.disabled = start + 1 >= total;
      }
      function render() {
        return load(start).then(function (image) {
          var pageWidth = image.naturalWidth, pageHeight = image.naturalHeight;
          canvas.width = pageWidth;
          canvas.height = pageHeight;
          context.fillStyle = '#fbfaf8';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, pageWidth, pageHeight);
          updateControls();
          if (start + 1 < total) load(start + 1);
        });
      }
      function turn(direction) {
        var target = start + (direction === 'next' ? 1 : -1);
        if (busy || target < 0 || target >= total) return;
        busy = true;
        var previousStart = start;
        start = target;
        render().then(function () {
          book.classList.add(direction === 'next' ? 'reader-turn-next' : 'reader-turn-prev');
          window.setTimeout(function () { book.className = 'reader-book'; busy = false; }, 520);
        }).catch(function () { start = previousStart; updateControls(); busy = false; });
      }
      prev.addEventListener('click', function () { turn('prev'); });
      next.addEventListener('click', function () { turn('next'); });
      document.addEventListener('keydown', function (event) { if (event.key === 'ArrowLeft') turn('prev'); if (event.key === 'ArrowRight') turn('next'); });
      var touchX = 0;
      book.addEventListener('touchstart', function (event) { touchX = event.changedTouches[0].clientX; }, { passive: true });
      book.addEventListener('touchend', function (event) { var delta = event.changedTouches[0].clientX - touchX; if (Math.abs(delta) > 45) turn(delta < 0 ? 'next' : 'prev'); }, { passive: true });
      book.addEventListener('click', function (event) { var rect = book.getBoundingClientRect(); turn(event.clientX > rect.left + rect.width / 2 ? 'next' : 'prev'); });
      render();
    }());
  </script>
</body>
</html>
